<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plein Air | Artist Gallery</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header>
    <nav>
      <h1><a href="/">Artist Gallery</a></h1>
    </nav>
  </header>

  <main>
    <div class="gallery-page">
  <h1>Plein Air</h1>

  
  <p class="gallery-description">Paintings created on location.</p>
  

  <div class="gallery-grid">
    
    <div class="gallery-item">
      <img
        src="/images/rmnp_plien_air.jpg"
        alt="RMNP Plein Air"
        data-full="/images/rmnp_plien_air.jpg"
        loading="lazy"
      >
      
      <div class="image-caption">RMNP Plein Air</div>
      
    </div>
    
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
  <span class="lightbox-close">&times;</span>
  <img class="lightbox-content" id="lightbox-img">
  <div id="lightbox-caption"></div>
</div>

  </main>

  <footer>
    <p>&copy; 2025 Artist Gallery. All artwork rights reserved.</p>
  </footer>

  <script src="/assets/js/gallery.js"></script>
</body>
</html>
