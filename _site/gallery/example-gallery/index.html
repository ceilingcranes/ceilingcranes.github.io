<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example Gallery | Artist Gallery</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header>
    <nav>
      <h1><a href="/">Artist Gallery</a></h1>
    </nav>
  </header>

  <main>
    <div class="gallery-page">
  <h1>Example Gallery</h1>

  
  <p class="gallery-description">This is an example gallery showcasing how to organize your artwork</p>
  

  <div class="gallery-grid">
    
    <div class="gallery-item">
      <img
        src="/images/example1.jpg"
        alt="First example artwork"
        data-full="/images/example1.jpg"
        loading="lazy"
      >
      
      <div class="image-caption">Example Artwork 1</div>
      
    </div>
    
    <div class="gallery-item">
      <img
        src="/images/example2.jpg"
        alt="Second example artwork"
        data-full="/images/example2.jpg"
        loading="lazy"
      >
      
      <div class="image-caption">Example Artwork 2</div>
      
    </div>
    
    <div class="gallery-item">
      <img
        src="/images/example3.jpg"
        alt="Third example artwork"
        data-full="/images/example3.jpg"
        loading="lazy"
      >
      
      <div class="image-caption">Example Artwork 3</div>
      
    </div>
    
    <div class="gallery-item">
      <img
        src="/images/example4.jpg"
        alt="Fourth example artwork"
        data-full="/images/example4.jpg"
        loading="lazy"
      >
      
      <div class="image-caption">Example Artwork 4</div>
      
    </div>
    
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
  <span class="lightbox-close">&times;</span>
  <img class="lightbox-content" id="lightbox-img">
  <div id="lightbox-caption"></div>
</div>

  </main>

  <footer>
    <p>&copy; 2025 Artist Gallery</p>
  </footer>

  <script src="/assets/js/gallery.js"></script>
</body>
</html>
